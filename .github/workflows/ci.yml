name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build, typecheck, test, and verify package entries
        run: npm run check

  browser-and-package:
    name: Browser and package
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and verify publication entries
        run: npm run build && npm run verify:package
      - name: Install the browser and CJK font for offline UI tests
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chrome
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Offline browser and official-theme checks
        run: npm run test:ui
      - name: Pack and inspect the distributable
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --json --pack-destination dist > dist/pack.json
          node scripts/verify-dist.mjs
      - name: Upload installable package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-opendesign-corouter-build
          path: |
            dist/*.tgz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload simulated UI previews and contrast report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-previews
          path: docs/previews/
          if-no-files-found: error
          retention-days: 14
