name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-dsh-opendesign-corouter
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify release identity and main ancestry
        id: preflight
        run: |
          node scripts/release-check.mjs preflight
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --version
          npm --version
      - name: Download the checked package from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dsh-opendesign-corouter-build
          path: release
      - name: Check registry state and artifact checksum
        id: registry
        run: node scripts/release-check.mjs registry "./release/${{ steps.preflight.outputs.filename }}"
      - name: Publish the same artifact using GitHub OIDC
        if: steps.registry.outputs.publish == 'true'
        run: npm publish "./release/${{ steps.preflight.outputs.filename }}" --access public --tag latest --provenance --ignore-scripts --registry=https://registry.npmjs.org
      - name: Verify the published integrity and provenance
        env:
          REQUIRE_PROVENANCE: ${{ steps.registry.outputs.publish }}
        run: node scripts/release-check.mjs verify "./release/${{ steps.preflight.outputs.filename }}"
